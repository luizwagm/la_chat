# ==========================================================================
#  lachat-upgrade.conf — o que o WebSocket exige do nginx
#
#  INSTALAR EM:  /etc/nginx/conf.d/lachat-upgrade.conf
#
#  Este é o preço do WebSocket, e ele é real: sem estas linhas o chat carrega,
#  autentica, mostra as conversas — e NUNCA recebe mensagem em tempo real.
#  Nada quebra visivelmente. O sintoma é "às vezes não chega", que é o pior
#  tipo de defeito para diagnosticar.
#
#  Por que num arquivo à parte, e não dentro do bloco do site:
#
#  O `map` precisa existir no contexto `http`, ANTES de qualquer `server` que
#  o use. Se ele morasse dentro do conf de um site, um segundo site que também
#  usasse o chat referenciaria uma variável que não existe — e `nginx -t`
#  falharia por um motivo sem relação nenhuma com o que se estava mexendo.
#
#  Em conf.d ele existe sempre, para todos os sites da máquina.
# ==========================================================================

# ==========================================================================
#  O `map` da negociação de Upgrade.
#
#  O cabeçalho `Connection` é POR SALTO: ele vale entre o cliente e o nginx, e
#  precisa ser reescrito entre o nginx e a aplicação. Passar o valor do cliente
#  adiante quebra tanto o WebSocket quanto o keep-alive das requisições normais.
#
#  Escrever `Connection: upgrade` fixo TAMBÉM está errado: aí TODA requisição
#  do site — incluindo as páginas comuns — anunciaria upgrade, e o keep-alive
#  entre nginx e Node morreria. Daí o `map`: só quem pediu upgrade recebe.
# ==========================================================================
map $http_upgrade $conexao_upgrade {
    default upgrade;
    ''      close;
}

# ==========================================================================
#  ZONA DO LIMITADOR DE ENTRADA
#
#  30 por minuto por endereço é folgado para gente (a pessoa entra uma vez por
#  dia) e apertado para robô. A trava da aplicação continua valendo — esta aqui
#  só evita que a requisição chegue a acordar o Node.
# ==========================================================================
limit_req_zone $binary_remote_addr zone=lachat_entrar:10m rate=30r/m;
