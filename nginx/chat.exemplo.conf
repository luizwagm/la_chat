# ==========================================================================
#  MODELO de bloco nginx para o LA Chat em SUBDOMÍNIO PRÓPRIO (arranjo B).
#
#  ATENÇÃO — leia antes de usar este arquivo:
#
#  Este arranjo é o SEGUNDO recomendado. O primeiro é o repasse pelo conector
#  (arranjo A), em que o chat NÃO tem subdomínio nenhum e o navegador vê tudo
#  na origem do site do cliente. Ver docs/INSTALLATION.md.
#
#  O arranjo A é preferível porque permite `SameSite=Strict` no cookie — a
#  proteção mais forte contra CSRF, de graça. Aqui, por ser entre sites, é
#  preciso `SameSite=None; Secure` e a defesa passa a depender do token CSRF e
#  da lista de origens. Funciona, mas tem mais peças para errar.
#
#  Use este arquivo quando: o hospedeiro não é Node, ou vários sites diferentes
#  compartilham UM chat.
#
#  Requer:  /etc/nginx/conf.d/lachat-upgrade.conf  (o `map` do Upgrade)
# ==========================================================================

server {
    listen 80;
    listen [::]:80;
    server_name chat.exemplo.com;

    # O desafio do certbot precisa passar em HTTP.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chat.exemplo.com;

    ssl_certificate     /etc/letsencrypt/live/chat.exemplo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.exemplo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # HSTS. Só depois de o certificado estar funcionando — ligar antes deixa o
    # navegador recusando `http://` para um domínio que ainda não tem TLS, e
    # não há como voltar atrás do lado do visitante.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # O chat NUNCA deve ser indexado nem embutido em iframe de terceiro.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # 12 MB: o teto de anexo (10 MB) mais folga para cabeçalhos. Sem isto o
    # nginx recusa o upload com 413 ANTES de o chat poder explicar o motivo em
    # português — e o usuário vê uma página de erro do nginx.
    client_max_body_size 12m;

    # ======================================================================
    #  O WEBSOCKET
    #
    #  `proxy_read_timeout` alongado é obrigatório: o padrão do nginx é 60s, e
    #  um socket de chat fica MINUTOS sem tráfego quando ninguém digita. Com o
    #  padrão, o nginx derruba a conexão em silêncio e o cliente reconecta a
    #  cada minuto — o sintoma é "o chat fica piscando reconectando".
    #
    #  7 dias é mais que o batimento de 25s precisa; quem decide se a conexão
    #  está viva é o ping/pong da aplicação, não o relógio do proxy.
    # ======================================================================
    location /chat/ws {
        proxy_pass http://127.0.0.1:5197;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $conexao_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  7d;
        proxy_send_timeout  7d;

        # Buffer DESLIGADO: com buffer, o nginx segura os eventos até encher —
        # e num fluxo de 80 bytes por mensagem ele nunca enche. O tempo real
        # chegaria em lotes de minutos.
        proxy_buffering off;
    }

    # Freio de entrada. `burst=5 nodelay` deixa a rajada normal de um
    # carregamento de página passar sem espera, e trava o resto.
    location /chat/entrar {
        limit_req zone=lachat_entrar burst=5 nodelay;
        proxy_pass http://127.0.0.1:5197;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /chat/ {
        proxy_pass http://127.0.0.1:5197;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upload de 10 MB numa rede ruim demora. O padrão de 60s cortaria o
        # envio no meio, e o usuário veria "falhou" sem motivo aparente.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Qualquer outra coisa neste subdomínio não existe. Não há site aqui.
    location / { return 404; }
}

# ==========================================================================
#  DEPOIS DE INSTALAR, CONFIRA COM `nginx -T`, E NÃO COM `nginx -t`.
#
#  O `-t` diz que a sintaxe está boa. O `-T` IMPRIME a configuração que o
#  nginx realmente carregou — e é a única forma de descobrir que o arquivo que
#  você editou não está sendo incluído (link simbólico ausente em
#  sites-enabled, `include` que não casa com o nome). Já aconteceu neste
#  parque: `nginx -t` aprovou um bloco que o nginx nem carregava.
#
#      nginx -T | grep -A5 'location /chat/ws'
# ==========================================================================
